default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false
      - id: strip-co-authored-by
        name: strip co-authored-by trailers
        entry: perl -0777 -i -pe 's/^co-authored-by:.*\n//gim; s/\s+\z/\n/'
        language: system
        stages: [commit-msg]
        always_run: true
