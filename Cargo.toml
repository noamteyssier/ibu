[workspace]
resolver = "2"
members = ["crates/ibu", "crates/ibu-cli"]

[workspace.package]
version = "0.3.0"
authors = ["Noam Teyssier"]
edition = "2021"
license = "MIT"
repository = "https://github.com/noamteyssier/ibu"
readme = "README.md"

[workspace.dependencies]
# internal
ibu = { path = "crates/ibu", version = "0.3.0" }

# external
anyhow = "1.0.100"
bitnuc = "0.5.2"
bytemuck = { version = "1.24.0", features = ["derive", "extern_crate_alloc"] }
bytesize = "2.3.1"
clap = { version = "4.5.53", features = ["derive"] }
ext-sort = "0.1.5"
memmap2 = "0.9.9"
niffler = "3.0.0"
num_cpus = "1.17.0"
parking_lot = "0.12.5"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
